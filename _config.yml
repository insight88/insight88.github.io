remote_theme: "mmistakes/minimal-mistakes@4.27.3"
title: Kipyo Kim's homepage
description: Computational Neuroscience MS/Phd
url: "https://insight88.github.io"
plugins:
  - jekyll-include-cache

locale: "en-US"
timezone: "Asia/Seoul"

author:
  name   : "Kipyo Kim"
  avatar : "https://ccs-lab.github.io/images/team/kipyo-kim.png"
  bio    : "MS/PhD student in Brain and Cognitive Science(BCS) at Seoul National University(SNU)"
  location: "Seoul, South Korea"
  email  : "kpkim1988@snu.ac.kr"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/insight88"
    - label: "Google Scholar"
      icon: "fas fa-graduation-cap"
      url: "https://scholar.google.com/"
    - label: "CV"
      icon: "fas fa-file-pdf"
      url: "/files/cv.pdf"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: true

include:
  - _pages

markdown: kramdown
highlighter: rouge

sass:
  style: compressed
